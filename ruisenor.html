corto:[
["El deseo del estudiante","Un joven estudiante llora porque su amada solo bailará con él si le lleva una rosa roja, y en su jardín no hay ninguna [pp. 1-2]. Aunque ha leído a los sabios y posee «todos los secretos de la filosofía», su vida le parece destrozada por no tener una rosa [p. 1]."],
["El ruiseñor lo entiende","El ruiseñor ve en el estudiante al «verdadero enamorado»: le ha cantado todas las noches sin conocerlo [p. 1]. Los demás (la lagartija, la mariposa, la margarita) no entienden y se burlan de que llore por una rosa [p. 2]."],
["La búsqueda y el terrible precio","Dos rosales no tienen rosas rojas; el tercero, helado por el invierno, solo ofrece un medio: hacerla con música al claro de luna y teñirla con la sangre del propio corazón del ruiseñor [pp. 3-4]. El ruiseñor acepta, pues «el amor es mejor que la vida» [p. 4]."],
["El sacrificio","El estudiante no comprende al ruiseñor porque «sólo sabía las cosas que están escritas en los libros» [p. 5], y lo juzga egoísta, de «puro estilo» y sin fin práctico [p. 5]. Esa noche el ruiseñor canta apoyado en las espinas hasta morir y la rosa se vuelve roja [pp. 6-8]."],

ext:[
["El estudiante y la rosa roja","pp. 1-2","El estudiante se lamenta porque la joven dijo que bailaría con él si le llevaba una rosa roja, y no hay ninguna en su jardín [p. 1]. Exclama: «¡Ah, de qué cosa más insignificante depende la felicidad! He leído cuanto han escrito los sabios; poseo todos los secretos de la filosofía y encuentro mi vida destrozada por carecer de una rosa roja» [p. 1]. Imagina el baile del príncipe, la música y a su amada bailando, pero sin rosa «tendré que estar solo» [pp. 1-2].","«He leído cuanto han escrito los sabios; poseo todos los secretos de la filosofía...» [p. 1]"],
["El ruiseñor y el amor verdadero","pp. 1-2","Desde su nido en la encina, el ruiseñor oye al estudiante y exclama: «He aquí, por fin, el verdadero enamorado»; le ha cantado todas las noches y cuenta su historia a las estrellas [p. 1]. Para él, el amor es «más bello que las esmeraldas y más raro que los finos ópalos» y no se compra ni se pesa en oro [p. 1]. La lagartija, la mariposa y la margarita no comprenden: «¿Por una rosa roja? ¡Qué tontería!», y la lagartija, «algo cínica», se ríe [p. 2]. El ruiseñor guarda silencio, reflexionando sobre «el misterio del amor» [p. 2]."],
["La búsqueda de la rosa roja","pp. 2-4","El ruiseñor vuela al rosal del prado y ofrece sus «canciones más dulces» por una rosa roja: las rosas son blancas [pp. 2-3]. El rosal del reloj de sol las tiene amarillas [p. 3]. El rosal bajo la ventana del estudiante las tiene rojas, pero «el invierno ha helado mis venas» y no dará más rosas este año [pp. 3-4]. Hay un medio, «tan terrible que no me atrevo a decírtelo»: hacerla con notas de música al claro de luna y teñirla con la sangre del corazón del ruiseñor, cantando con el pecho apoyado en las espinas toda la noche [p. 4]."],
["El pacto y la elección del ruiseñor","pp. 4-5","El ruiseñor reconoce que «la muerte es un buen precio por una rosa roja» y que todo el mundo ama la vida, con sus bellezas [p. 4]. Aun así decide: «el amor es mejor que la vida. ¿Y qué es el corazón de un pájaro comparado con el de un hombre?» [p. 4]. Promete la rosa al estudiante y solo le pide que sea un verdadero enamorado, «porque el amor es más sabio que la filosofía [...] más fuerte que el poder» [p. 5]. El estudiante no lo entiende, pues «sólo sabía las cosas que están escritas en los libros» [p. 5]. La encina sí lo comprende y se entristece; el ruiseñor le canta su última canción [p. 5]."],
["Lo que piensa el estudiante","p. 5","Tras oír cantar al ruiseñor, el estudiante saca su cuaderno y lo juzga: tiene belleza innegable, «¿pero siente? Me temo que no». Es «como muchos artistas: puro estilo, exento de sinceridad», «no se sacrifica por los demás», solo piensa en la música y el arte y por eso es egoísta [p. 5]. Lamenta que sus notas no tengan «sentido alguno» ni persigan «ningún fin práctico» [p. 5]. Luego se duerme pensando en su adorada [p. 6]. Hay una ironía: el juicio es injusto, porque el ruiseñor está a punto de sacrificarse por él."],
["La noche del sacrificio","pp. 6-8","El ruiseñor canta toda la noche con el pecho contra las espinas; la luna escucha [p. 6]. Primero canta el nacimiento del amor en un joven y una muchacha, y una rosa pálida se abre en la rama más alta [p. 6]. El rosal le grita que se apriete más: «o llegará el día antes de que la rosa esté terminada» [pp. 6-7]. Al cantar la pasión, aparece un rubor en los pétalos, pero el corazón de la rosa sigue blanco, porque «sólo la sangre de un ruiseñor puede colorear el corazón de una rosa» [p. 7]. Cuando las espinas tocan su corazón, canta «el amor sublimado por la muerte, el amor que no termina en la tumba», y la rosa se vuelve roja como un rubí [p. 7]. Su voz se debilita y muere con el corazón traspasado de espinas [pp. 7-8]."],
["La rosa rechazada","pp. 8-9","A mediodía el estudiante abre la ventana, ve la rosa y exclama: «¡Qué extraña buena suerte!»; piensa que debe tener «un nombre muy enrevesado» en latín, y la corta [p. 8]. Corre a casa del profesor y se la ofrece a la joven, que la rechaza: «Temo que esta rosa no armonice bien con mi vestido»; además, el sobrino del chambelán le envió joyas, que «cuestan más que las flores» [pp. 8-9]. Él, furioso, tira la rosa al arroyo y un pesado carro la aplasta [p. 9]. Ella lo desprecia: «¿qué eres? Un simple estudiante» sin hebillas de plata [p. 9]."],
["El regreso a la filosofía","p. 9","El estudiante concluye: «¡Qué tontería es el amor! No es ni la mitad de útil que la lógica, porque no puede probar nada; habla siempre de cosas que no sucederán» [p. 9]. Como «en nuestra época todo estriba en ser práctico», decide volver a la filosofía y a la metafísica [p. 9]. Abre «un gran libro polvoriento» y se pone a leer, que es el final del cuento [p. 9]."]]};

["La respuesta de la hija del profesor ilustra…","una valoración materialista, donde el precio decide el valor",["una crítica a la música","un amor sincero","un rechazo por modestia"],"Pp. 8-9."],
["El hecho de que el estudiante vuelva a la filosofía al final sugiere…","que no aprendió nada del sacrificio del ruiseñor",["que ha comprendido el amor","que se hará artista","que olvidó a la joven por prudencia"],"P. 9. Interpretación."],
["Cuando el estudiante dice que el arte es «puro estilo, exento de sinceridad», el cuento muestra que…","puede haber sinceridad profunda detrás de la belleza que él no reconoce",["los artistas siempre son egoístas","el arte debe ser práctico","el ruiseñor no sentía nada"],"Pp. 5-8. Interpretación."],
["¿Qué papel cumple la luna en la noche del sacrificio?","Se detiene a escuchar el canto durante toda la noche",["Se oculta del ruiseñor","Ilumina el jardín del estudiante","Ayuda al rosal a florecer"],"Pp. 6, 8."]
];
var N=10;
function fmt(t){return t.replace(/\[([^\]]+)\]/g,'<span class="anchor">$1</span>')}
var seen={},total=R.ext.length;
function build(){
 var h='<section class="panel on" id="Pr"><div class="sub"><button class="on" onclick="subt(0)">Resumen corto</button><button onclick="subt(1)">Resumen extenso</button></div>';
 h+='<div class="sp on"><p class="lede">Oscar Wilde, «El ruiseñor y la rosa». Las etiquetas indican la página del PDF.</p>';
 R.corto.forEach(function(s,i){h+='<div class="step"><h3>'+(i+1)+'. '+s[0]+'</h3><p>'+fmt(s[1])+'</p></div>'});
 h+='</div><div class="sp"><p class="lede">Desarrollo por escenas. Las etiquetas indican la página del PDF.</p><div class="acc">';
 R.ext.forEach(function(s,i){h+='<div class="item"><button class="hd" onclick="acc(this,'+i+')"><span>'+s[0]+'<small>'+s[1]+'</small></span><span class="ch">▾</span></button><div class="bd"><div>'+fmt(s[2])+'</div>'+(s[3]?'<div class="cita">'+fmt(s[3])+'</div>':'')+'</div></div>'});
 h+='</div></div></section><section class="panel" id="Pa"><p class="lede">Lectura filosófica y ética del cuento. Son interpretaciones para preparar preguntas de análisis; contrástalas con lo visto en clase.</p>';
 AN.forEach(function(b){h+='<div class="bridge"><h3>'+b[0]+'</h3><p class="lede" style="font-size:.8rem;margin:0 0 8px">'+b[1]+'</p><div class="cols"><div class="col k"><b>En el texto</b>'+fmt(b[2])+'</div><div class="col s"><b>Lectura</b>'+fmt(b[3])+'</div></div><div class="pq"><b>Posible pregunta de control</b>'+b[4]+'</div></div>'});
 h+='</section><section class="panel" id="Pq"><div id="quiz"></div></section><footer>Herramienta de repaso. Basada en «El ruiseñor y la rosa», de Oscar Wilde, en la versión en español del material del curso. Uso de estudio personal.</footer>';
 document.getElementById('app').innerHTML=h}
function prog(){var n=Object.keys(seen).length;document.getElementById('fill').style.width=Math.round(n/total*100)+'%';document.getElementById('lbl').textContent=n+' de '+total+' escenas extensas revisadas'}
function tab(t){document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==t)});['r','a','q'].forEach(function(x){document.getElementById('P'+x).classList.toggle('on',x==t)});document.getElementById('lbl').style.visibility=t=='r'?'visible':'hidden'}
function subt(i){var p=document.getElementById('Pr');p.querySelectorAll('.sub button').forEach(function(b,j){b.classList.toggle('on',j==i)});p.querySelectorAll('.sp').forEach(function(s,j){s.classList.toggle('on',j==i)})}
function acc(h,id){var b=h.nextElementSibling;if(h.classList.toggle('open')){b.style.maxHeight=b.scrollHeight+'px';seen[id]=1;prog()}else b.style.maxHeight=null}
// Cuestionario
var set,qi,score,wrong,cur,done;
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){set=sh(Q).slice(0,N);qi=0;score=0;wrong=[];show()}
function show(){
 if(qi>=N)return end();
 var q=set[qi];cur=sh([q[1]].concat(q[2]));done=false;
 var h='<div class="card"><div class="qmeta">Pregunta '+(qi+1)+' de '+N+' · Aciertos: '+score+' · Nivel intermedio</div><p class="qq">'+q[0]+'</p>';
 cur.forEach(function(o,k){h+='<button class="opt" onclick="pick('+k+')">'+o+'</button>'});
 document.getElementById('quiz').innerHTML=h+'<div id="fb"></div></div>'}
function pick(k){
 if(done)return;done=true;var q=set[qi],ok=cur[k]===q[1];
 document.querySelectorAll('.opt').forEach(function(b,j){b.disabled=true;if(cur[j]===q[1])b.classList.add('ok');else if(j===k)b.classList.add('no')});
 if(ok)score++;else wrong.push(q);
 document.getElementById('fb').innerHTML='<div class="fb"><b>'+(ok?'¡Correcto! ':'No exactamente. ')+'</b>'+q[3]+'</div><button class="btn" onclick="qi++;show()">'+(qi<N-1?'Siguiente':'Ver resultado')+'</button>'}
function end(){
 var m=score>=9?'Excelente dominio.':score>=7?'Muy bien, repasa los errores.':score>=5?'Vas bien, conviene repasar.':'Repasa la lectura y vuelve a intentarlo.';
 var h='<div class="card"><div class="qmeta">Resultado</div><div class="score">'+score+' / '+N+'</div><p>'+m+'</p>';
 if(wrong.length){h+='<h2 style="font-size:1rem">Para repasar</h2>';wrong.forEach(function(q){h+='<div class="rev"><b>'+q[0]+'</b>Respuesta: '+q[1]+' ('+q[3]+')</div>'})}
 document.getElementById('quiz').innerHTML=h+'<button class="btn" onclick="start()">Nuevo cuestionario</button></div>'}


build();prog();start();
</script>
</body>
</html>
